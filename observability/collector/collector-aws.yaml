# Collector for ECS Fargate. Traces go to X-Ray, logs to CloudWatch Logs
# and metrics to CloudWatch via EMF. The task role must allow
# xray:PutTraceSegments, logs:CreateLogGroup, logs:PutLogEvents
# and cloudwatch:PutMetricData. AWS_REGION is required.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert
      - key: service.namespace
        value: lab22
        action: insert
      - key: cloud.provider
        value: aws
        action: insert
      - key: cloud.region
        value: ${env:AWS_REGION}
        action: insert
      - key: collector.pipeline
        value: aws
        action: upsert

  resourcedetection:
    detectors: [env, ecs, ec2, system]
    timeout: 5s
    override: false

  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/actuator/health"'
        - 'attributes["url.path"] == "/actuator/health/liveness"'
        - 'attributes["url.path"] == "/actuator/health/readiness"'

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  awsxray:
    region: ${env:AWS_REGION}
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: /lab22/services
    log_stream_name: otel-collector
  awsemf:
    region: ${env:AWS_REGION}
    namespace: Lab22/Services
    log_group_name: /lab22/metrics

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, resourcedetection, filter/health, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, resourcedetection, batch]
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, resourcedetection, batch]
      exporters: [awscloudwatchlogs]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
