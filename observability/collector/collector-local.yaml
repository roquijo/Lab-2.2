# Collector local. Receives OTLP from the Java services and exports:
# traces -> Tempo, metrics -> Prometheus scrape endpoint, logs -> Loki.
# Cloud exporters are intentionally absent: they require credentials and would
# fail the pipeline on a laptop.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: insert
      - key: service.namespace
        value: lab22
        action: insert
      - key: collector.pipeline
        value: local
        action: upsert

  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/actuator/health"'
        - 'attributes["url.path"] == "/actuator/health/liveness"'
        - 'attributes["url.path"] == "/actuator/health/readiness"'
        - 'attributes["http.route"] == "/actuator/health"'

  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["trace_id"], trace_id.string) where trace_id.string != "00000000000000000000000000000000"
          - set(attributes["span_id"], span_id.string) where span_id.string != "0000000000000000"
          - set(body, Concat(["trace_id=", trace_id.string, " span_id=", span_id.string, " ", body.string], "")) where trace_id.string != "00000000000000000000000000000000"

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 120s

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 120s

  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 5m
    enable_open_metrics: true
    translation_strategy: UnderscoreEscapingWithSuffixes
    resource_constant_labels:
      included:
        - service.name
        - service.version
        - deployment.environment
        - service.namespace
        - cloud.provider

  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/health, batch]
      exporters: [otlp_grpc/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/logs, batch]
      exporters: [otlp_http/loki, debug]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: false
                without_units: false
