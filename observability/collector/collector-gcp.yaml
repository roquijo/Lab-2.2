# Collector for GKE. Exports traces and logs with the googlecloud exporter
# (Cloud Trace and Cloud Logging) and metrics with googlemanagedprometheus.
# Do not use this file in Docker Compose: it expects GCP credentials
# (Workload Identity or node service account) and GCP_PROJECT_ID.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert
      - key: service.namespace
        value: lab22
        action: insert
      - key: cloud.provider
        value: gcp
        action: insert
      - key: cloud.region
        value: ${env:CLOUD_REGION}
        action: insert
      - key: collector.pipeline
        value: gcp
        action: upsert

  resourcedetection:
    detectors: [env, gcp, system]
    timeout: 5s
    override: false

  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/actuator/health"'
        - 'attributes["url.path"] == "/actuator/health/liveness"'
        - 'attributes["url.path"] == "/actuator/health/readiness"'

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  googlecloud:
    project: ${env:GCP_PROJECT_ID}
    log:
      default_log_name: lab22-services
  googlemanagedprometheus:
    project: ${env:GCP_PROJECT_ID}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, resourcedetection, filter/health, batch]
      exporters: [googlecloud]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, resourcedetection, batch]
      exporters: [googlemanagedprometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, resourcedetection, batch]
      exporters: [googlecloud]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
