apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: lab22
type: Opaque
stringData:
  MYSQL_PASSWORD: CAMBIAR-password-local-del-lab
  MYSQL_ROOT_PASSWORD: CAMBIAR-root-password
  SPRING_DATASOURCE_PASSWORD: CAMBIAR-password-local-del-lab
