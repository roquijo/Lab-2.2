global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: lab22
    environment: local

scrape_configs:
  - job_name: otel-apps
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
