apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name=~"service-a|service-b"} | trace_id=`$${__trace.traceId}`'
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: Tasa de solicitudes
            query: sum(rate(http_server_request_duration_seconds_count{service_name="$${__tags.service.name}"}[5m]))
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=([0-9a-f]{32})"
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Ver traza
        - name: TraceIDJson
          matcherRegex: "\"trace_id\":\"([0-9a-f]{32})\""
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Ver traza
