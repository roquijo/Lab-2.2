server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: service-a
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lab22?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lab}
    password: ${SPRING_DATASOURCE_PASSWORD:lab22-local}
    hikari:
      maximum-pool-size: 5
      pool-name: service-a-pool

app:
  service-b-url: ${SERVICE_B_URL:http://localhost:8081}
  version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: service-a
    version: 1.0.0
    description: Compone un pedido con la disponibilidad de inventario
